<!DOCTYPE html>
<html lang="ku">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kurdiaii</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #111827,
                #1f2937
            );

            color: white;
        }

        .card {
            width: 92%;
            max-width: 420px;

            padding: 30px;

            border-radius: 24px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(15px);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;

            background: #2563eb;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            line-height: 1.8;
            color: #d1d5db;
            font-size: 15px;
        }

        .consent {
            margin: 25px 0;
            padding: 15px;

            border-radius: 14px;

            background: rgba(255,255,255,0.06);

            text-align: left;

            font-size: 14px;
            line-height: 1.7;
        }

        .consent input {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }

        .photo-button {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 14px;

            background: #2563eb;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .photo-button:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            line-height: 1.6;
        }

        #preview {
            width: 100%;
            max-height: 300px;

            object-fit: cover;

            border-radius: 15px;

            margin-top: 20px;

            display: none;
        }

        .small {
            margin-top: 20px;

            font-size: 12px;

            color: #9ca3af;

            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        📸
    </div>

    <h1>Kurdiaii</h1>

    <div class="description">
        وێنەکەت هەڵبژێرە یان وێنەیەکی نوێ بگرە.
        <br>
        پێش ناردن، ڕەزامەندی خۆت پشتڕاست دەکەیتەوە.
    </div>

    <div class="consent">

        <label>

            <input
                type="checkbox"
                id="consent"
            >

            من ڕازیم کە ئەم وێنەیەی خۆم هەڵبژاردووم
            بۆ بۆتەکە بنێردرێت.

        </label>

    </div>

    <input
        type="file"
        id="photo"
        accept="image/*"
        capture="user"
        style="display:none"
    >

    <button
        class="photo-button"
        id="chooseButton"
        disabled
    >
        📷 هەڵبژاردنی وێنە / کامێرا
    </button>

    <img
        id="preview"
        alt="Selected photo"
    >

    <p id="status"></p>

    <div class="small">
        هیچ وێنەیەک بەبێ هەڵبژاردن و
        ڕەزامەندی بەکارهێنەر نەنێردرێت.
    </div>

</div>

<script>

const consent =
    document.getElementById("consent");

const chooseButton =
    document.getElementById("chooseButton");

const photoInput =
    document.getElementById("photo");

const status =
    document.getElementById("status");

const preview =
    document.getElementById("preview");


consent.addEventListener("change", function () {

    chooseButton.disabled = !this.checked;

});


chooseButton.addEventListener("click", function () {

    if (!consent.checked) {

        status.innerText =
            "تکایە سەرەتا ڕەزامەندی بدە.";

        return;
    }

    photoInput.click();

});


photoInput.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        status.innerText =
            "تکایە تەنها وێنە هەڵبژێرە.";

        return;
    }

    preview.src =
        URL.createObjectURL(file);

    preview.style.display = "block";

    status.innerText =
        "وێنەکە ئامادەی ناردنە...";

    const formData =
        new FormData();

    formData.append(
        "photo",
        file
    );

    try {

        const response =
            await fetch(
                "/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

        const result =
            await response.json();

        if (result.success) {

            status.innerText =
                "✅ وێنەکە بە سەرکەوتوویی نێردرا.";

            photoInput.value = "";

        } else {

            status.innerText =
                "❌ " +
                (result.message ||
                "هەڵەیەک ڕوویدا.");

        }

    } catch (error) {

        status.innerText =
            "❌ کێشەی پەیوەندی بە سێرڤەرەوە هەیە.";

    }

});

</script>

</body>
</html>
